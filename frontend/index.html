<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Love Lock 💙</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- hearts background layer (fullscreen) -->
<div id="hearts-layer"></div>

<div id="container">

<!-- LOCK + INPUT + BUTTON -->
<div id="lock-area">
<div id="lock-wrapper">
<img id="lock" src="lock.png" alt="lock" />
<input id="password" type="text" placeholder="geslo..." />
</div>

<button id="button" type="button">klikni</button>
</div>

<!-- CAT + SPEECH -->
<div id="cat-area">
<div id="speech-wrapper">
<img id="speech" src="hint.png" alt="hint bubble" />
<p id="hint-text">Bleh~</p>
</div>

<img id="cat" src="cat1.png" alt="cat" />
</div>

</div>

<script src="script.js"></script>
</body>
</html>
