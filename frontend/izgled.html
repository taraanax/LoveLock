<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Love Lock 💙</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="container">

<div id="lock-area">
<div id="lock-wrapper">
<img id="lock" src="lock.png" alt="lock" />

<!-- input je NA lock sliki -->
<input id="password" type="text" placeholder="geslo..." />
</div>

<!-- button POD lockom -->
<img id="button" src="button.png" alt="unlock button" />
</div>

<div id="cat-area">
<!-- speech bubble levo -->
<div id="speech-wrapper">
<img id="speech" src="hint.png" alt="hint bubble" />
<p id="hint-text">Mijav~ 🐾</p>
</div>

<img id="cat" src="cat1.png" alt="cat" />
</div>

</div>

<script src="script.js"></script>
</body>
</html>
